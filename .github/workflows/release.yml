name: Package release
run-name: Package release · ${{ github.event_name }} · ${{ github.ref_name }}

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      packages:
        description: 'Packages to prepare (comma-separated names, or all). Rerun failed jobs to reuse an existing release.'
        required: true
        default: all
        type: string
      base:
        description: 'Previous reviewed release baseline (full 40-character commit SHA). Required for delivery metadata and version comparison.'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: npm-release
  queue: max
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      has-release: ${{ steps.plan.outputs.has-release }}
    env:
      RELEASE_REF: ${{ github.ref }}
      RELEASE_BASE: ${{ github.event.before || inputs.base }}
      RELEASE_PACKAGES: ${{ inputs.packages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.4.0'
      - name: Select packages with new versions
        id: plan
        run: node scripts/plan-release.ts
      - name: Summarize release decision
        env:
          HAS_RELEASE: ${{ steps.plan.outputs.has-release }}
          PUBLISH_ENABLED: ${{ vars.NPM_PUBLISH_ENABLED }}
        run: |
          if [ "$HAS_RELEASE" != 'true' ]; then
            printf 'No package version changed; publication skipped.\n' >> "$GITHUB_STEP_SUMMARY"
          elif [ "$PUBLISH_ENABLED" != 'true' ]; then
            printf 'Release artifacts will be validated; npm publication is disabled.\n' >> "$GITHUB_STEP_SUMMARY"
          else
            printf 'Release selected; publishing and postpublication verification must still succeed.\n' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: steps.plan.outputs.has-release == 'true'
        with:
          bun-version-file: package.json
      - name: Check release notes and selected versions
        if: steps.plan.outputs.has-release == 'true'
        run: node scripts/validate-release.ts
      - name: Validate and pack packages
        if: steps.plan.outputs.has-release == 'true'
        uses: ./.github/actions/validate-packages
      - name: Validate selected release archives
        if: steps.plan.outputs.has-release == 'true'
        run: node scripts/release-manifest.ts --selected
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.plan.outputs.has-release == 'true'
        with:
          name: npm-consumer-build
          path: |
            apps/cli/.publish/
            apps/cli/.publish-intloom/
            packages/utils/dist/
            packages/loom-sdk/dist/
            packages/compiler/dist/
            packages/intent/dist/
            .release/*.tgz
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.plan.outputs.has-release == 'true'
        with:
          name: npm-release
          path: .release/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  package-tests:
    name: Test release artifacts
    needs: prepare
    if: needs.prepare.outputs.has-release == 'true'
    uses: ./.github/workflows/consumer.yml

  publish:
    name: Publish to npm
    needs: [prepare, package-tests]
    if: needs.prepare.outputs.has-release == 'true' && vars.NPM_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_REF: ${{ github.ref }}
      RELEASE_PUBLISH_ENABLED: ${{ vars.NPM_PUBLISH_ENABLED }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.4.0'
          registry-url: https://registry.npmjs.org
      - name: Install publishing npm version
        run: npm install --global npm@11.21.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-release
          path: .release/
      - name: Publish verified archives to npm
        run: node scripts/publish-release.ts

  verify-published:
    name: Verify npm packages · ${{ matrix.os }} · Node ${{ matrix.node }}
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['26.4.0', '26']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-release
          path: .release/
      - name: Verify registry integrity and consumer installations
        run: node scripts/verify-published.ts

  github-release:
    name: Create GitHub releases
    needs: verify-published
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.4.0'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-release
          path: .release/
      - name: Create GitHub releases and attach verified archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/finalize-release.ts
