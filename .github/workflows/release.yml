name: Intloom Release
on:
  workflow_run:
    workflows: [Framework CI]
    types: [completed]
    branches: [main]

permissions: {contents: read, actions: read}
concurrency:
  group: publish-framework
  queue: max
  cancel-in-progress: false
env:
  RUN_ID: ${{ github.event.workflow_run.id }}
jobs:
  select:
    name: Check framework release criteria
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-24.04
    outputs:
      enabled: ${{ steps.input.outputs.enabled }}
      version: ${{ steps.input.outputs.version }}
      sha: ${{ steps.input.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with: {persist-credentials: false}
      - uses: ./.github/actions/release-input
        id: input
        with: {run-id: "${{ env.RUN_ID }}", unit: framework}
  publish:
    name: Publish framework to npm
    needs: select
    if: needs.select.outputs.enabled == 'true'
    runs-on: ubuntu-24.04
    environment: npm
    permissions: {contents: read, actions: read, id-token: write}
    steps:
      - uses: actions/checkout@v7
        with: {ref: "${{ needs.select.outputs.sha }}", persist-credentials: false}
      - uses: actions/setup-node@v7
        with: {node-version-file: .node-version, package-manager-cache: false}
      - uses: actions/download-artifact@v8
        with: {name: release-candidate, path: "${{ runner.temp }}/candidate", run-id: "${{ env.RUN_ID }}", github-token: "${{ github.token }}"}
      - run: node .github/scripts/release-npm-packages.mjs publish framework "$RUNNER_TEMP/candidate"
  verify-registry:
    name: Test framework installs from npm
    needs: [select, publish]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with: {ref: "${{ needs.select.outputs.sha }}", persist-credentials: false}
      - uses: actions/setup-node@v7
        with: {node-version-file: .node-version, package-manager-cache: false}
      - uses: actions/download-artifact@v8
        with: {name: release-candidate, path: "${{ runner.temp }}/candidate", run-id: "${{ env.RUN_ID }}", github-token: "${{ github.token }}"}
      - run: node .github/scripts/release-npm-packages.mjs verify framework "$RUNNER_TEMP/candidate"
  record:
    name: Create framework GitHub release
    needs: [select, verify-registry]
    runs-on: ubuntu-24.04
    permissions: {contents: write, actions: write}
    steps:
      - uses: actions/checkout@v7
        with: {ref: "${{ needs.select.outputs.sha }}", persist-credentials: false}
      - uses: actions/download-artifact@v8
        with: {name: release-candidate, path: "${{ runner.temp }}/candidate", run-id: "${{ env.RUN_ID }}", github-token: "${{ github.token }}"}
      - name: Record verified release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.select.outputs.version }}
          SHA: ${{ needs.select.outputs.sha }}
        run: |
          set -euo pipefail
          node .github/scripts/publish-github-release.mjs framework "framework-v$VERSION" "$VERSION" "$SHA" "$RUNNER_TEMP/candidate"
          if [[ $(jq .units.cli.changed "$RUNNER_TEMP/candidate/plan.json") == true ]]; then
            gh workflow run cli-release.yml --ref main -f run_id="$RUN_ID"
          fi
