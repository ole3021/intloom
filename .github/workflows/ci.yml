name: CI
run-name: CI · ${{ github.event_name }} · ${{ github.head_ref || github.ref_name }}

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate and pack packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.4.0'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - name: Validate and pack packages
        uses: ./.github/actions/validate-packages
      - name: Validate package archives
        run: node scripts/release-manifest.ts
      - name: Upload package test artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-consumer-build
          path: |
            apps/cli/.publish/
            apps/cli/.publish-intloom/
            packages/utils/dist/
            packages/loom-sdk/dist/
            packages/compiler/dist/
            packages/intent/dist/
            .release/*.tgz
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  package-tests:
    name: Test package artifacts
    needs: validate
    uses: ./.github/workflows/consumer.yml
