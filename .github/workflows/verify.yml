name: Framework CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    name: Verify authoring and Code runtime (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    env:
      TURBO_FORCE: "true"
      TURBO_TELEMETRY_DISABLED: "1"
      INTLOOM_ARCHIVES_DIR: .release/authoring
    steps:
      - uses: actions/checkout@v7
        with: {persist-credentials: false}
      - uses: actions/setup-node@v7
        with: {node-version-file: .node-version, package-manager-cache: false}
      - uses: oven-sh/setup-bun@v2
        with: {bun-version-file: package.json}
      - run: bun install --frozen-lockfile
      - name: Prepare workspace compiler links
        run: |
          bun run --cwd packages/loom-sdk build
          bun run --cwd packages/compiler build
          bun install --frozen-lockfile
      - run: bun run verify
      - uses: actions/upload-artifact@v7
        if: matrix.os == 'ubuntu-24.04'
        with:
          name: authoring-archives
          path: .release/authoring
          if-no-files-found: error
  npm-consumers:
    name: Consume authoring and Code runtime (Node ${{ matrix.node }}, ${{ matrix.os }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        node: ["22.22.0", "24.0.0", "26.0.0"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with: {persist-credentials: false}
      - uses: actions/setup-node@v7
        with: {node-version: "${{ matrix.node }}", package-manager-cache: false}
      - uses: actions/download-artifact@v8
        with: {name: authoring-archives, path: "${{ runner.temp }}/authoring"}
      - run: npm run test:e2e
        env:
          INTLOOM_ARCHIVES_DIR: ${{ runner.temp }}/authoring
          INTLOOM_REQUIRE_ARCHIVES: "1"
