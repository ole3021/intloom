name: Resolve verified main candidate
description: Bind a release unit to the Linux archives tested by Framework CI.
inputs:
  run-id: {required: true, description: Framework CI run ID}
  unit: {required: true, description: Release unit}
outputs:
  enabled: {value: "${{ steps.plan.outputs.enabled }}", description: Unit version increased in a merged PR}
  version: {value: "${{ steps.plan.outputs.version }}", description: Release version}
  sha: {value: "${{ steps.origin.outputs.sha }}", description: Tested commit}
runs:
  using: composite
  steps:
    - id: origin
      shell: bash
      env:
        RUN_ID: ${{ inputs.run-id }}
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        [[ "$RUN_ID" =~ ^[0-9]+$ ]]
        run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID")
        sha=$(jq -er --arg repo "$GITHUB_REPOSITORY" 'select(.path == ".github/workflows/verify.yml" and .event == "push" and .head_branch == "main" and .head_repository.full_name == $repo and .conclusion == "success") | .head_sha' <<< "$run")
        echo "sha=$sha" >> "$GITHUB_OUTPUT"
    - uses: actions/download-artifact@v8
      with:
        name: release-candidate
        path: ${{ runner.temp }}/candidate
        run-id: ${{ inputs.run-id }}
        github-token: ${{ github.token }}
    - id: plan
      shell: bash
      working-directory: ${{ runner.temp }}/candidate
      env:
        UNIT: ${{ inputs.unit }}
        GH_TOKEN: ${{ github.token }}
        SHA: ${{ steps.origin.outputs.sha }}
      run: |
        set -euo pipefail
        jq -e --arg sha "$SHA" '.commit == $sha and .status == "verified"' candidate.json >/dev/null
        jq -e --arg sha "$SHA" '.sha == $sha' plan.json >/dev/null
        shasum -a 256 -c SHA256SUMS >/dev/null
        enabled=$(jq -r --arg u "$UNIT" '.units[$u].changed' plan.json)
        if ! jq -e 'length > 0' merged-prs.json >/dev/null; then enabled=false; fi
        if [[ "$UNIT" == cli && "$GITHUB_EVENT_NAME" == workflow_run && $(jq .units.framework.changed plan.json) == true ]]; then enabled=false; fi
        if [[ "$enabled" == true && "$UNIT" == cli && "$GITHUB_EVENT_NAME" == workflow_dispatch && $(jq .units.framework.changed plan.json) == true ]]; then
          tag="framework-v$(jq -r .units.framework.version plan.json)"
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft | grep -qx false
          target=$(git ls-remote "https://github.com/$GITHUB_REPOSITORY.git" "refs/tags/$tag" "refs/tags/$tag^{}" | tail -1 | cut -f1)
          [[ "$target" == "$SHA" ]]
        fi
        echo "enabled=$enabled" >> "$GITHUB_OUTPUT"
        echo "version=$(jq -er --arg u "$UNIT" '.units[$u].version' plan.json)" >> "$GITHUB_OUTPUT"
