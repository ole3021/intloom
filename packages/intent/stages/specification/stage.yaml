stage:
  name: specification
  state:
    schema: ./schema/state.ts
    initialize: ../../src/initialize.ts
  entry: prepare
  steps:
    prepare:
      type: code
      code: ./codes/prepare.ts
      on:
        ready:
          target: analyze
        complete:
          end: true
    analyze:
      type: agent
      agent: ./agents/requirement-analyst.md
      llm: thinking
      outputSchema: ./schema/result.ts
      skills:
        - ./skills/requirements-analysis/SKILL.md
      tools:
        - ./tools/index.ts#readSpecificationContext
        - ../../src/tools/project.ts#listProject
        - ../../src/tools/project.ts#readProject
        - ../../src/tools/project.ts#readEvidence
        - ../../src/tools/project.ts#readHistory
        - ../../src/tools/questions.ts#requestClarification
        - ./tools/index.ts#submitSpecificationAnalysis
      on:
        ready:
          target: check_scope
        needs_input:
          target: resolve
    check_scope:
      type: code
      code: ./codes/check_scope.ts
      on:
        ready:
          target: draft
        needs_input:
          target: resolve
    draft:
      type: agent
      agent: ./agents/requirement-analyst.md
      llm: thinking
      outputSchema: ./schema/result.ts
      skills:
        - ./skills/requirements-analysis/SKILL.md
      tools:
        - ./tools/index.ts#readSpecificationContext
        - ../../src/tools/project.ts#listProject
        - ../../src/tools/project.ts#readProject
        - ../../src/tools/project.ts#readEvidence
        - ../../src/tools/project.ts#readHistory
        - ../../src/tools/questions.ts#requestClarification
        - ./tools/index.ts#editSpecification
        - ./tools/index.ts#submitSpecification
      on:
        ready:
          target: check
        needs_input:
          target: resolve
    check:
      type: code
      code: ./codes/check.ts
      on:
        ready:
          target: confirm
        draft:
          target: draft
        analyze:
          target: analyze
    confirm:
      type: code
      code: ./codes/confirm.ts
      on:
        confirmed:
          target: commit
        feedback:
          target: draft
    resolve:
      type: code
      code: ./codes/resolve.ts
      on:
        ready:
          target: analyze
    commit:
      type: code
      code: ./codes/commit.ts
      on:
        complete:
          end: true
