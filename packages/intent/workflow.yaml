workflow:
  name: intent
  exclusive: true
  entry: specification
  stages:
    specification:
      stage: "@stages/specification"
      on:
        complete:
          target: solution
    solution:
      stage: "@stages/solution"
      on:
        complete:
          target: implementation
    implementation:
      stage: "@stages/implementation"
      on:
        complete:
          target: validation
    validation:
      stage: "@stages/validation"
      on:
        complete:
          end: true
