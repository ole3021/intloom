id: L01
version: 4
name: Operations workspace
scale: large
description: Evolve a local operations workspace through ten Intent iterations.
intents:
  - "Create a local modular operations project from this empty workspace. Implement intake creation and listing for service requests. Validate titles and customer references, generate IDs and create queued requests. Establish shared contracts and clear application boundaries."
  - "Persist requests in one project-relative JSON store and expose the intake operations through a local CLI. Preserve intake behavior and reject operations without partially writing data."
  - "Add request cancellation before completion, preserving the existing lifecycle. Reject invalid request IDs and invalid transitions consistently."
  - "Add scheduling: assign a queued request to a known operator and scheduled date, save the assignment and transition the request to scheduled. Keep scheduling separate from intake."
  - "Add completion of scheduled requests. Preserve cancellation rules, linked assignments and previously delivered CLI operations."
  - "Add a read-only reporting summary with counts for every request status and the current assignments. Preserve shared data and module boundaries."
  - "Add status filtering to intake listing. Support the existing status values; omitted filters list every request in stable creation order. Reject unknown filters."
  - "Add per-operator reporting with scheduled and completed assignment counts. Include registered operators with no assignments and do not mutate stored data."
  - "Add a read-only JSON export of requests and assignments through reporting. Write JSON to stdout with a schema version of 1 and stable creation order; do not introduce a second store."
  - "Complete local CLI help and usage documentation for intake, cancellation, scheduling, completion, filters, summary, operator reports and JSON export. Review the existing module checks and preserve all previous behavior."
