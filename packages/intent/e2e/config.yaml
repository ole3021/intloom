workflow:
  source: ..
  flowName: intent
models:
  user: minimax-m3
  cmd:
    default:
      model: glm-5.3
      providerOptions:
        openai:
          reasoningEffort: low
    reasoning:
      model: glm-5.3
      providerOptions:
        openai:
          reasoningEffort: low
    coding: minimax-m3
    review: minimax-m3
  mcp:
    worker:
      model: glm-5.3
      providerOptions:
        openai:
          reasoningEffort: low
# Optional limits; this suite bounds model sessions without a case-size budget table.
limits:
  maxUserSteps: 160
  maxAgentSteps: 64
  modelConnectionTimeoutMs: 120000
  modelIdleTimeoutMs: 180000
# Omit maxDurationMs to use no E2E wall-clock limit.
#   maxDurationMs: 7200000
#   commandTimeoutMs: 30000
#   modelConnectionRetries: 0
preparation:
  scripts:
    - checks/prepare.ts
acceptance:
  instructions: acceptance.md

# Enable the optional business-evidence script explicitly:
#   scripts:
#     - checks/results.ts
