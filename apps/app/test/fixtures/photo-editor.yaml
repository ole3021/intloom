version: 0.4.0
defaultCommand: apply
commands:
  learn:
    input:
      type: object
      properties:
        name: {type: string, minLength: 1}
        note: {type: string}
        pairs:
          type: array
          minItems: 1
          items:
            type: object
            properties:
              raw: {type: string}
              edited: {type: string}
            required: [raw, edited]
            additionalProperties: false
      required: [name, pairs]
      additionalProperties: false
    output: Versioned style-profile.json for local RAW processing
  apply:
    input:
      type: object
      properties:
        directory: {type: string, minLength: 1}
        profile: {type: string, minLength: 1}
        quality: {type: integer, minimum: 1, maximum: 100}
      required: [directory, profile]
      additionalProperties: false
    output: ZIP of sRGB JPEGs, per-image adjustments and processing report
