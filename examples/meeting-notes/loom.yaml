schemaVersion: "0.5"
name: Meeting Notes
description: Turn one meeting source into concise, evidence-linked minutes.
entry: ./src/summarize.ts
execution:
  scope: intloom
input:
  prompt:
    description: Meeting source text; provide either prompt or one file
  files:
    maxItems: 1
    extensions: [".txt", ".md"]
    description: Exactly one UTF-8 .txt or .md file at a complete path, instead of prompt
  folders:
    maxItems: 0
  exactlyOne: [prompt, files]
output:
  summary:
    type: markdown
    path: meeting-notes.md
resources:
  - ./README.md
  - ./editor.md
  - ./samples
