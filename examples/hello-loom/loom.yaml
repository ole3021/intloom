schemaVersion: "0.5"
name: Hello Loom
description: Ask your name, check nearby weather and write a localized greeting card.
entry: ./src/hello.ts
execution:
  scope: intloom
input:
  prompt:
    description: Optional BCP 47 locale, such as en-US or zh-CN; defaults to the runtime locale
output:
  summary:
    type: markdown
    path: hello.md
resources:
  - ./README.md
